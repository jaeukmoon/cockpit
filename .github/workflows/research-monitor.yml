name: Refresh encrypted research dashboard

on:
  schedule:
    - cron: '20 7 * * 1-5'   # Korean close: Mon-Fri 16:20 KST
    - cron: '20 22 * * 1-5'  # US close: Tue-Sat 07:20 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cloud_monitor/**'
      - '.github/workflows/research-monitor.yml'

permissions:
  contents: read

concurrency:
  group: encrypted-research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated monitoring dependencies
        run: pip install -r scripts/cloud_monitor/requirements.txt
      - name: Verify monitoring contracts
        run: python -m unittest discover -s scripts/cloud_monitor -p 'test_*.py' -v
      - name: Collect closes and append encrypted research observations
        id: collect
        env:
          MONITORING_DATA_KEY: ${{ secrets.MONITORING_DATA_KEY }}
        run: python scripts/cloud_monitor/refresh.py
      - name: Publish only receipt-validated state
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cloud_monitor/publish_state.py
